image: php:8.5-cli

definitions:
  caches:
    composer: ~/.composer/cache
  services:
    database:
      image: mariadb:10.6
      variables:
        MARIADB_DATABASE: db_test
        MARIADB_ROOT_PASSWORD: root
  steps:
    - step: &check
        name: Check (cs, stan, phpunit)
        caches: [composer]
        services: [database]
        script:
          - apt-get update && apt-get install -y git unzip libzip-dev && docker-php-ext-install pdo_mysql
          - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          - composer install --no-interaction --prefer-dist
          - composer cs
          - composer stan
          - export DB_HOST=127.0.0.1 DB_USER=root DB_PASS=root DB_NAME=db_test DB_TEST_NAME=db_test
          - vendor/bin/phinx migrate -e testing
          - composer test

pipelines:
  default:
    - step: *check
  branches:
    main:
      - step:
          name: Mirror to GitHub
          image: alpine/git:latest
          clone:
            depth: full
          script:
            # Needs repository variable GITHUB_MIRROR_URL (git@github.com:you/repo.git)
            # and an SSH deploy key with write access registered under Pipelines > SSH keys.
            - git push --mirror "$GITHUB_MIRROR_URL"
      - step: *check